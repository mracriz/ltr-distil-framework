[tool.poetry]
name = "llm-as-judge-for-ltr"
version = "0.1.0"
description = "Experimentos de LLM para ranking, analises e carregamento de dados"
authors = ["David"]
readme = "README.md"
package-mode = false

[tool.poetry.dependencies]
python = ">=3.12,<3.13"
pandas = "^2.3.0"
numpy = "^2.2.0"
pyarrow = "^21.0.0"
polars = "^1.32.0"
scikit-learn = "^1.7.0"
matplotlib = "^3.10.0"
seaborn = "^0.13.0"
jupyterlab = "^4.4.0"
ipykernel = "^6.30.0"
tqdm = "^4.67.0"
python-dotenv = "^1.1.0"
pydantic = "^2.11.0"
openai = ">=2.12.0,<3.0.0"
anthropic = "^0.60.0"
litellm = "^1.74.0"
pyserini = "^2.3.0"
ir-datasets = "^0.6.3"
duckdb = "^1.4.1"
lightgbm = "^4.7.0"
openrouter = "^1.1.157"
beir = "^2.2.0"
torch = ">=2.2.0"
peft = "^0.14.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.12.0"
pytest = "^8.4.0"

[tool.pytest.ini_options]
pythonpath = ["."]

[build-system]
requires = ["poetry-core>=1.9.0"]
build-backend = "poetry.core.masonry.api"
